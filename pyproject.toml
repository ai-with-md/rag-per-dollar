[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdecisions"
version = "0.1.0"
description = "Which RAG choices improve answers per dollar? A measured study on public question-answering data"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Meenal Asesh"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/ai-with-md/rag-per-dollar"

[project.optional-dependencies]
run = ["pyarrow", "rank-bm25", "sentence-transformers>=3.0"]
notebooks = ["jupyter", "nbformat", "nbconvert", "ipykernel"]
dev = ["pytest"]

[tool.setuptools]
packages = ["ragdecisions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
